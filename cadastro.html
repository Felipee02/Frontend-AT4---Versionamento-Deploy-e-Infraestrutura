<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Amigos Fiéis</title>
    <meta name="description" content="Cadastre-se como voluntário, doador ou apoiador da ONG Amigos Fiéis.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
    <header>
        <h1>Ong Amigos Fiéis</h1>
        <hr>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <hr>
        <section aria-labelledby="cadastro">
            <h2 id="cadastro">Cadastro de Participante</h2>
            <p>Preencha o formulário abaixo para se cadastrar como voluntário, doador ou apoiador da ONG Amigos Fiéis.</p>

            <!-- Aqui adicionamos o evento onsubmit -->
            <form onsubmit="mostrarMensagem(); return false;" method="post">
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="Digite um CPF válido, apenas números" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" pattern="(\(?\d{2}\)?\s?)?\d{4,5}-?\d{4}" title="Formato esperado: 11912345678 ou (11) 91234-5678" required>

                    <label for="nascimento">Data de nascimento:</label>
<input type="date" id="nascimento" name="nascimento" min="1920-01-01" required>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const inputData = document.getElementById("nascimento");
        const hoje = new Date();
        const dia = String(hoje.getDate()).padStart(2, '0');
        const mes = String(hoje.getMonth() + 1).padStart(2, '0'); // Janeiro = 0
        const ano = hoje.getFullYear();
        inputData.max = `${ano}-${mes}-${dia}`;
    });
</script>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" pattern="\d{5}-?\d{3}" title="Formato esperado: 00000-000" required>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="SP">SP</option>
                        <option value="RJ">RJ</option>
                        <option value="MG">MG</option>
                        <option value="RS">RS</option>
                        <option value="PR">PR</option>
                        <option value="BA">BA</option>
                        <option value="PE">PE</option>
                        <option value="SC">SC</option>
                        <option value="DF">DF</option>
                    </select>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Interesse</legend>
                    <label for="perfil">Quero me cadastrar como:</label>
                    <select id="perfil" name="perfil" required>
                        <option value="">Selecione</option>
                        <option value="voluntario">Voluntário</option>
                        <option value="doador">Doador</option>
                        <option value="apoiador">Apoiador</option>
                    </select>
                </fieldset>

                <p></p>
                <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
        <script>
            function mostrarMensagem() {
                alert("Cadastro enviado com sucesso! 🐾");
            }
        </script>
    </main>
    <footer>
        <p>&copy; 2025 ONG Amigos Fiéis. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
